<meta charset="UTF-8">

<title>Thank You — Canon Moment Photography</title>
<!-- Do not index post-conversion page (keeps it out of search & keeps conversion counts accurate) -->
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://canonmomentphotography.com/thank-you">

<style>
  :root{--charcoal:#1C1C1C;--gold:#C9A96E;--gold-dark:#9B7A3F;--warm-white:#FDFCFA;--cream:#F5F1EA;--gray:#8A8A8A;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--charcoal);color:var(--warm-white);font-family:'Jost',sans-serif;font-weight:300;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;text-align:center;position:relative;overflow:hidden}
  .glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(201,169,110,0.12) 0%,transparent 65%);pointer-events:none}
  .wrap{position:relative;z-index:2;max-width:560px}
  .check{width:74px;height:74px;border-radius:50%;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;margin:0 auto 30px;animation:pop .5s cubic-bezier(.25,.46,.45,.94)}
  .check svg{width:34px;height:34px;stroke:var(--gold);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  @keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
  .eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-bottom:18px}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:clamp(38px,6vw,60px);line-height:1.05;margin-bottom:20px}
  h1 em{font-style:italic;color:var(--gold)}
  p{font-size:15px;line-height:1.8;color:rgba(255,255,255,.6);max-width:460px;margin:0 auto 14px}
  .meta{font-size:13px;color:rgba(255,255,255,.4);margin-top:8px}
  .meta a{color:var(--gold);text-decoration:none}
  .actions{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:40px}
  .btn{font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;padding:15px 30px;text-decoration:none;cursor:pointer;transition:all .25s}
  .btn-primary{background:var(--gold);color:var(--charcoal);font-weight:500;border:1px solid var(--gold)}
  .btn-primary:hover{background:var(--gold-dark);border-color:var(--gold-dark)}
  .btn-ghost{background:transparent;color:var(--warm-white);border:1px solid rgba(201,169,110,.45)}
  .btn-ghost:hover{background:rgba(201,169,110,.1);border-color:var(--gold)}
</style>
</head>

<!-- Google Tag Manager (noscript) -->

<div class="glow" aria-hidden="true"></div>
<div class="wrap">
  <div class="check"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
  <div class="eyebrow">Message Received</div>
  <h1>Thank you — your<br><em>moment awaits.</em></h1>
  <p>We've received your inquiry and will personally respond <strong style="color:var(--warm-white);font-weight:400">within 24 hours</strong> (usually much sooner).</p>
  <p class="meta">Need us right away? Call or text <a href="tel:+13213006314">(321) 300-6314</a></p>
  <div class="actions">
    <a class="btn btn-primary" href="/gallery">View Our Work</a>
    <a class="btn btn-ghost" href="/">Back to Home</a>
  </div>
</div>
<script>
  // Fire the lead conversion on this page's load (most reliable — page loads never miss).
  (function(){
    var src = new URLSearchParams(location.search).get('src') || 'lead_form';
    try {
      gtag('event', 'generate_lead', {
        currency: 'USD',
        value: 1,
        form_source: src,
        event_callback: function(){}
      });
    } catch(e){}
    // Push to dataLayer for Google Tag Manager (use this to fire a Google Ads conversion in GTM)
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({ event: 'lead_form_submitted', form_source: src });
  })();
</script>
